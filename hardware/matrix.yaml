version: "1.0.0"

devices:
  # ----------------------------------------------------------------------
  # Tier B: Blob-Reduced Sovereign Hardware
  # ----------------------------------------------------------------------
  - vendor: "PINE64"
    model: "PinePhone"
    soc: "Allwinner A64 (Quad-core ARM Cortex-A53)"
    bootloader_unlock: true
    bootloader_relock: false
    kill_switches:
      mic: true
      camera: true
      radio: true
    modem: "Quectel EG25-G (LTE Cat-4)"
    modem_firmware_status: "replaced"
    wifi_bt_firmware_status: "proprietary_signed"
    gpu_firmware_status: "free"
    camera_firmware_status: "free"
    blob_inventory:
      - component: "Realtek RTL8723CS Wi-Fi/Bluetooth Firmware"
        license: "Proprietary Realtek"
        source: "linux-firmware / rtl_bt/rtl8723cs_xx.bin"
        replaceable_by_librephone: true
      - component: "Quectel EG25-G Hexagon DSP Baseband Blob"
        license: "Proprietary Qualcomm Hexagon"
        source: "Quectel Stock Firmware (isolated via USB)"
        replaceable_by_librephone: false
    treble_compatible: false
    talos_support_level: "Tier B"
    notes: "Hardware DIP kill-switches on rear chassis. Runs mainline Linux kernel with open-source Lima GPU driver. Modem userspace replaced with Biktor open-source firmware, though isolated Hexagon DSP blob remains."

