name: Key Guard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  key-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Key Guard Check
        run: |
          chmod +x ./scripts/pre-commit-key-guard.sh ./scripts/key-guard.sh
          ./scripts/pre-commit-key-guard.sh
          bash ./scripts/key-guard.sh
