name: Independent Rebuild & Attestation Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro-independent:
    runs-on: ubuntu-24.04
    steps:
      - name: Fresh Checkout (No Cache)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            make \
            python3 \
            nodejs \
            npm \
            e2fsprogs \
            tar \
            xz-utils \
            diffutils \
            git

      - name: Build Current Commit & Compute Hashes
        run: |
          mkdir -p out/current
          ./scripts/repro-build.sh out/current
          echo "Current commit build completed successfully."

      - name: Publish Current Commit Build Artifacts & Hashes
        uses: actions/upload-artifact@v4
        with:
          name: repro-hashes-${{ github.sha }}
          path: |
            out/current/SHA256SUMS.txt
            out/current/metadata/build-metadata.json
          if-no-files-found: error

      - name: Locate Most Recent Tagged Release Attestation
        id: find_release
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RELEASE_SHA=""
          ATTESTATION_FILE=""

          if [ -n "$LATEST_TAG" ]; then
            TAG_SHA=$(git rev-list -n 1 "$LATEST_TAG")
            if [ -f "repro/attestation-${TAG_SHA}.json" ]; then
              RELEASE_SHA="$TAG_SHA"
              ATTESTATION_FILE="repro/attestation-${TAG_SHA}.json"
            fi
          fi

          if [ -z "$ATTESTATION_FILE" ]; then
            for f in repro/attestation-*.json; do
              [ -e "$f" ] || continue
              [ "$f" = "repro/attestation-latest.json" ] && continue
              F_SHA=$(basename "$f" | sed -e 's/^attestation-//' -e 's/\.json$//')
              if git cat-file -e "$F_SHA" 2>/dev/null; then
                RELEASE_SHA="$F_SHA"
                ATTESTATION_FILE="$f"
                break
              fi
            done
          fi

          if [ -n "$ATTESTATION_FILE" ] && [ -n "$RELEASE_SHA" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
            echo "attestation_file=$ATTESTATION_FILE" >> "$GITHUB_OUTPUT"
            echo "Selected release attestation: $ATTESTATION_FILE for SHA $RELEASE_SHA"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No release attestation to verify yet; current-commit hashes recorded."
          fi

      - name: Rebuild & Verify Release SHA
        if: steps.find_release.outputs.found == 'true'
        run: |
          RELEASE_SHA="${{ steps.find_release.outputs.release_sha }}"
          ATTESTATION="${{ steps.find_release.outputs.attestation_file }}"
          echo "Checking out release $RELEASE_SHA in detached worktree..."
          git worktree add /tmp/release-worktree "$RELEASE_SHA"

          echo "Rebuilding release in clean detached worktree..."
          mkdir -p /tmp/release-out
          (cd /tmp/release-worktree && ./scripts/repro-build.sh /tmp/release-out)

          echo "Verifying independent rebuild against attestation..."
          python3 repro/verify-attestation.py "$ATTESTATION" /tmp/release-out

          ATTESTATION_HASH=$(sha256sum "$ATTESTATION" | awk '{print $1}')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UTC_NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUNNER_ID="GitHub-Actions-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}"

          STATUS_LABEL="UNSIGNED SELF-CHECK"
          FINGERPRINT_FILE="store/keys/fingerprint.txt"
          PUBKEY_FILE="store/keys/fdroid-signing.pub"
          ATTESTATION_SIG="${ATTESTATION}.sig"
          if [ -f "$FINGERPRINT_FILE" ] && ! grep -q "UNPINNED" "$FINGERPRINT_FILE"; then
            EXPECTED_FP=$(tr -d '[:space:]' < "$FINGERPRINT_FILE")
            if [ -f "$PUBKEY_FILE" ] && [ -f "$ATTESTATION_SIG" ]; then
              ACTUAL_FP=$(python3 -c 'import hashlib, sys; print(hashlib.sha256(bytes.fromhex(open(sys.argv[1]).read().strip())).hexdigest())' "$PUBKEY_FILE" 2>/dev/null || true)
              if [ -n "$EXPECTED_FP" ] && [ "$EXPECTED_FP" = "$ACTUAL_FP" ] && \
                 python3 store/sign-index.py verify --index "$ATTESTATION" --sig "$ATTESTATION_SIG" --pubkey "$PUBKEY_FILE" >/dev/null 2>&1; then
                STATUS_LABEL="SIGNED SELF-CHECK"
              fi
            fi
          fi

          echo "=========================================================================="
          echo "REPRODUCIBILITY SELF-CHECK COMPLETE ($STATUS_LABEL)"
          echo "| $UTC_NOW | $RELEASE_SHA | self (github-actions@$RUNNER_ID) | $ATTESTATION_HASH | $STATUS_LABEL | $RUN_URL |"
          echo "=========================================================================="

      - name: Exit Notice If No Release Attestation
        if: steps.find_release.outputs.found != 'true'
        run: |
          echo "=========================================================================="
          echo "✔ NOTICE: No release attestation to verify yet; current-commit hashes recorded."
          echo "Workflow completed successfully in compliance with Step 2.1b."
          echo "=========================================================================="
