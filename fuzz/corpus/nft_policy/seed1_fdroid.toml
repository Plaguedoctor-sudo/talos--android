# LibreDroid Egress Policy: F-Droid Client
[app]
id = "org.fdroid.fdroid"
name = "F-Droid App Store"
type = "container"
systemd_unit = "waydroid-container.service"

[network]
mode = "tunnel_only"
allowed_interfaces = ["wg0", "tun0"]
dns_policy = "enforce_dot"
anti_features_visible = true
kill_switch = true
